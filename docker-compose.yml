version: '3.8'
services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ai_teacher_db
      - OPENAI_API_KEY=
      - TEACHER_API_KEY=devkey123
    depends_on:
      - db
  frontend:
    image: python:3.11-slim
    working_dir: /srv
    volumes:
      - ./frontend:/srv
      - ./backend:/backend
    command: sh -c "pip install --no-cache-dir -r /backend/requirements.txt && streamlit run /srv/streamlit_app.py --server.port 8501 --server.headless true"
    ports:
      - "8501:8501"
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_teacher_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
