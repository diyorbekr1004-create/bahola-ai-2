name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyflakes
      - name: Lint (pyflakes)
        run: python -m pyflakes backend/app frontend scripts
      - name: Run tests
        working-directory: backend
        run: pytest -q
      - name: Smoke-test seed script
        env:
          DATABASE_URL: sqlite:///./ci_seed.db
          EXPORT_DIR: ./ci_exports
        run: python scripts/seed.py --reset

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t bahola-backend:ci .
      - name: Build frontend image
        run: docker build -t bahola-frontend:ci -f frontend/Dockerfile .
